name: Data refresh

on:
  # Started by an outside timer (cron-job.org) every 10 minutes (:07, :17, :27, :37, :47, :57), August-February, Eastern time.
  # GitHub's own schedules were removed: they started runs hours late, and GitHub switches them off after
  # 60 days without repository activity. See docs/MAINTAINING.md.
  workflow_dispatch:         # adds a "Run workflow" button on the Actions tab
    inputs:
      test_alert:
        description: 'Test the alarm: make this run fail on purpose'
        type: boolean
        default: false
      accept_score_changes:
        description: 'Accept many changed final scores at once (only after checking they are real)'
        type: boolean
        default: false

permissions:
  contents: write            # lets the workflow save the updated data files
  issues: write              # lets it open an issue when something goes wrong
  actions: read              # lets the alarm check whether the previous run also failed

concurrency:
  group: data-updates
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0, pinned to an exact commit
        with:
          ref: main            # start from the newest saved data, even if this run waited in line
          persist-credentials: false   # the write key is only handed to the save step below
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0, pinned to an exact commit
        with:
          python-version: '3.x'      # the newest Python 3 available; the scripts use only Python's built-in tools
      - name: Download results and rebuild this season's data
        shell: bash
        env:
          TEST_ALERT: ${{ inputs.test_alert }}   # passed as a variable, never pasted into the script
          ACCEPT_SCORE_CHANGES: ${{ inputs.accept_score_changes }}
        run: |
          if [ "$TEST_ALERT" = "true" ]; then echo "Test of the failure alarm (nothing is wrong)." | tee run.log; exit 1; fi
          python scripts/update.py 2>&1 | tee run.log; exit ${PIPESTATUS[0]}
      - name: Save the new data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add data
          if git diff --cached --quiet; then echo "No changes to save."; else git commit -m "Data refresh" && git pull --rebase -X theirs --quiet && git push; fi
      - name: Check for warnings (data was saved; this only raises the alarm)
        run: if [ -f run_warning.txt ]; then cat run_warning.txt | tee -a run.log; exit 1; fi
      - name: Report a problem
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB: Data refresh
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_FILE: daily-refresh.yml
          ALERT_AFTER: '4'           # open an issue only after four failed runs in a row (30-40 minutes)
          TEST_ALERT: ${{ inputs.test_alert }}
        run: bash scripts/report_failure.sh
      - name: Close any open problem report
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB: Data refresh
        run: bash scripts/report_success.sh
