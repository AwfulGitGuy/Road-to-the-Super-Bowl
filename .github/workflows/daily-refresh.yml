name: Data refresh

on:
  schedule:
    # Times are UTC. Eastern is UTC-4 until early November, then UTC-5.
    - cron: '7 */3 * * *'            # every 3 hours, all week (catches line moves and injury news)
    - cron: '7,37 13-23 * * 0'       # Sunday games (about 9 AM to 8 PM Eastern)
    - cron: '7,37 0-5 * * 1'         # Sunday night game, into early Monday
    - cron: '7,37 23 * * 1'          # Monday night kickoff (early doubleheader games)
    - cron: '7,37 0-5 * * 2'         # Monday night game, into early Tuesday
    - cron: '7,37 0-5 * * 5'         # Thursday night game, into early Friday
    - cron: '7,37 17-23 * * 6'       # Saturday games (late season and playoffs)
    - cron: '7,37 0-5 * * 0'         # Saturday night games, into early Sunday
  workflow_dispatch:         # adds a "Run workflow" button on the Actions tab
    inputs:
      test_alert:
        description: 'Test the alarm: make this run fail on purpose'
        type: boolean
        default: false

permissions:
  contents: write            # lets the workflow save the updated data files
  issues: write              # lets it open an issue when something goes wrong
  actions: read              # lets the alarm check whether the previous run also failed

concurrency:
  group: data-updates
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0, pinned to an exact commit
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0, pinned to an exact commit
        with:
          python-version: '3.12'
      - name: Download results and rebuild this season's data
        shell: bash
        run: |
          if [ "${{ inputs.test_alert }}" = "true" ]; then echo "Test of the failure alarm (nothing is wrong)." | tee run.log; exit 1; fi
          python scripts/update.py 2>&1 | tee run.log; exit ${PIPESTATUS[0]}
      - name: Save the new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes to save."; else git commit -m "Data refresh" && git push; fi
      - name: Report a problem
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB: Data refresh
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_FILE: daily-refresh.yml
          ALERT_AFTER: '2'           # open an issue only after two failed runs in a row
          TEST_ALERT: ${{ inputs.test_alert }}
        run: bash scripts/report_failure.sh
      - name: Close any open problem report
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB: Data refresh
        run: bash scripts/report_success.sh
