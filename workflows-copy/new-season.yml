name: Set up the new season

on:
  # Started by an outside timer (cron-job.org) on Mondays at 9:47 AM Eastern in August and September.
  # See docs/MAINTAINING.md.
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Test the alarm: make this run fail on purpose'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: data-updates
  cancel-in-progress: false

jobs:
  rollover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0, pinned to an exact commit
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0, pinned to an exact commit
        with:
          python-version: '3.x'      # the newest Python 3 available; the scripts use only Python's built-in tools
      - name: Set up next season if its schedule is out
        shell: bash
        run: |
          if [ "${{ inputs.test_alert }}" = "true" ]; then echo "Test of the failure alarm (nothing is wrong)." | tee run.log; exit 1; fi
          python scripts/new_season.py 2>&1 | tee run.log; exit ${PIPESTATUS[0]}
      - name: Save the new season's files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Nothing new to save."; else git commit -m "Set up new season" && git pull --rebase --quiet && git push; fi
      - name: Report a problem
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB: New-season setup
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALERT_AFTER: '1'           # weekly job: report the first failure
        run: bash scripts/report_failure.sh
      - name: Close any open problem report
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB: New-season setup
        run: bash scripts/report_success.sh
