name: Daily data refresh

on:
  schedule:
    - cron: '52 12 * * *'   # every day at 12:52 UTC (8:52 AM Eastern in fall, 7:52 AM in winter)
  workflow_dispatch:         # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write            # lets the workflow save the updated data files

concurrency:
  group: data-updates
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download results and rebuild this season's data
        run: python scripts/update.py
      - name: Save the new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes to save."; else git commit -m "Daily data refresh" && git push; fi
