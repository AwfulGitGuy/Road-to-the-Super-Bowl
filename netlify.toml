# Netlify settings: this is a plain static site, so there is nothing to build.
[build]
  publish = "."
  command = ""

# Security settings for everything the site serves. The page only loads its own
# files plus Google Fonts, sends nothing anywhere, and can't be embedded in other sites.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

# Always fetch fresh data files so new results show up right away.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"
